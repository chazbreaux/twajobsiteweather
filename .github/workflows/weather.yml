name: Log weather

on:
  schedule:
    # Runs shortly after 08:00, 12:00 and 17:00 Central so each part of the day is
    # recorded as soon as it is complete. Central time is UTC-5 in summer and UTC-6
    # in winter, so it runs at both possible UTC hours; the extra runs change nothing.
    - cron: "5 13,14,17,18,22,23 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Optional: also fill in this many past days (up to 90). Leave 0 for normal use."
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  group: weather-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record weather
        env:
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
        run: |
          mkdir -p data
          python log_weather.py
      - name: Save readings
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Weather records $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push)
