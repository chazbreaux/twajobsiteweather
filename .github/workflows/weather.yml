name: Log weather

on:
  schedule:
    # Central time is UTC-5 in summer and UTC-6 in winter, so this runs at both
    # possible UTC hours. The script only records when it is the right hour in
    # Central time (8 am, 12 noon, 5 pm) and skips anything already recorded.
    - cron: "5 13,14,17,18,22,23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Record a reading right now (replaces that time slot's reading)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weather-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record weather
        env:
          FORCE: ${{ inputs.force }}
        run: |
          mkdir -p data
          python log_weather.py
      - name: Save readings
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Weather readings $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push)
